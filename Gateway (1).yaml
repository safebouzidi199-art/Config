eureka:
    client:
        registerWithEureka: true
        fetchRegistry: true
        serviceUrl:
            defaultZone: http://localhost:9095/eureka
    instance:
      prefer-ip-address: false
      hostname: localhost
      instance-id: ${spring.application.name}:${server.port}
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: CATALOGUE-SERVICE
              uri: lb://CATALOGUE-SERVICE
              predicates:
                - Path=/catalogue/**
              filters:
                - RewritePath=/catalogue/(?<lien>.*), /${lien}
            - id: COMMANDE-SERVICE
              uri: lb://COMMANDE-SERVICE
              predicates:
                - Path=/commande/**
              filters:
                - RewritePath=/commande/(?<lien>.*), /${lien}
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: read-only




